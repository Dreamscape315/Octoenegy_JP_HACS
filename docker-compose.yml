# 本地开发调试用：跑一个独立的 Home Assistant 容器，把
# custom_components/octopus_energy_jp 直接绑定挂载进去，
# 改代码后只需要 `docker compose restart` 就能生效，不用传文件。
#
# 用法:
#   docker compose up -d        # 启动
#   docker compose logs -f      # 看日志
#   docker compose restart      # 改完代码后重启生效
#   docker compose down         # 停止并移除容器（配置数据还在 dev_config_docker/ 里）
#
# 启动后浏览器打开 http://localhost:8123 完成首次引导（建管理员账号），
# 然后 设置 -> 设备与服务 -> 添加集成 -> 搜索 "Octopus Energy Japan"

services:
  homeassistant:
    container_name: octopus_jp_dev
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./dev_config_docker:/config
      - ./custom_components/octopus_energy_jp:/config/custom_components/octopus_energy_jp
      # 公司网络会对所有出站 HTTPS 做 SSL 检查（中间人拦截），容器默认的证书库
      # 不认识公司自签的根证书，导致请求 Octopus/HA 官方接口都会报
      # CERTIFICATE_VERIFY_FAILED。这里把 certifi 官方证书包 + 公司证书链拼接
      # 好的 bundle 挂进去，用 REQUESTS_CA_BUNDLE 环境变量覆盖 HA 默认走的
      # certifi.where()（见 homeassistant/util/ssl.py）。
      - ./docker-ca/combined-ca-bundle.pem:/config/combined-ca-bundle.pem:ro
    environment:
      - TZ=Asia/Tokyo
      - REQUESTS_CA_BUNDLE=/config/combined-ca-bundle.pem
    ports:
      - "8123:8123"
    restart: unless-stopped

